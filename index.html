<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وش اسمك؟</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- شاشة السؤال وإدخال الاسم -->
        <div id="input-card" class="card">
            <h1>وش اسمك؟</h1>
            <p class="subtitle">فضلاً، اكتب اسمك لنعضه لك:</p>
            <form id="name-form">
                <input type="text" id="name-input" placeholder="اكتب اسمك هنا..." required autocomplete="off">
                <button type="submit" class="btn">إرسال</button>
            </form>
        </div>

        <!-- شاشة عرض النتيجة -->
        <div id="result-card" class="card hidden">
            <h1>أهلاً بك</h1>
            <p class="subtitle">اسمك هو:</p>
            <div id="name-box" class="name-display"></div>
            <button id="reset-btn" class="btn secondary-btn">تغيير الاسم</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
